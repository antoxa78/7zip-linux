[package]
name = "sevenzip-gui"
version = "1.0.13"
edition = "2021"
description = "A Linux GUI for 7-Zip, inspired by the Windows File Manager"
license = "GPL-3.0-or-later"
authors = ["Antoxa78"]

[package.metadata.deb]
name = "7zip-linux"
maintainer = "Antoxa78 <antoxa78@users.noreply.github.com>"
copyright = "2026 Antoxa78"
depends = "p7zip-full, libgtk-4-1, libadwaita-1-0"
section = "utils"
priority = "optional"
extended-description = """A Linux GUI for 7-Zip, inspired by the Windows File Manager.
.
Features:
 - Create archives: 7z, zip, tar, tar.gz, tar.bz2, tar.xz, tar.zst
 - Extract archives: 7z, rar, zip, tar, gz, bz2, xz, zst, lz4
 - Browse archive contents like a regular directory
 - Password protection for encrypted archives
 - Drag & drop support
 - File manager integration scripts"""

[[package.metadata.deb.assets]]
source = "target/release/7zip-linux"
dest = "/usr/bin/7zip-linux"
mode = "755"

[[package.metadata.deb.assets]]
source = "data/7zip-linux.desktop"
dest = "/usr/share/applications/7zip-linux.desktop"

[[package.metadata.deb.assets]]
source = "data/icons/hicolor/48x48/apps/7zip-linux.png"
dest = "/usr/share/icons/hicolor/48x48/apps/7zip-linux.png"

[[package.metadata.deb.assets]]
source = "data/icons/hicolor/scalable/apps/7zip-linux.png"
dest = "/usr/share/icons/hicolor/scalable/apps/7zip-linux.png"

[[package.metadata.deb.assets]]
source = "data/icons/hicolor/scalable/actions/password-protect-archive-symbolic.svg"
dest = "/usr/share/icons/hicolor/scalable/actions/password-protect-archive-symbolic.svg"

[[bin]]
name = "7zip-linux"
path = "src/main.rs"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_7"] }
glib = { version = "0.22", package = "glib" }
gio = { version = "0.22", package = "gio" }
gdk-pixbuf = { version = "0.22", package = "gdk-pixbuf" }
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2"
chrono = "0.4"

[build-dependencies]
chrono = "0.4"
